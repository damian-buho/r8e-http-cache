---
name: ${M6E_COMPOSE_PROJECT_NAME}
services:
  r8e-http-cache:
    container_name: ${M6E_CONTAINER_INSTANCE}
    image: ${M6E_IMAGE_FULLNAME}
    # Preset: large (2.0c, 4g) — CI build/test container. Bounded so it can't starve the shared host.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    networks:
      - dev-network
    environment:
      - LANG
      - TZ
      - R8E_HTTP_CACHE_ALLOWLIST_REGEX=^r8e-http-cache$
    volumes:
      - r8e-http-cache-data:/app/cache
networks:
  dev-network:
    name: ${M6E_COMPOSE_PROJECT_NAME}-network
volumes:
  r8e-http-cache-data:
    name: r8e-http-cache-data
